<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Thermal Printer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Thermal Printer Web</h1>
            <p>Connect to your BLE or Serial ESC/POS printer.</p>
        </header>

        <section class="connection-section">
            <div class="connection-buttons">
                <button id="btnConnectSerial" class="btn primary">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z"></path><path d="M8 2h8"></path><path d="M8 22h8"></path><path d="M8 8h8"></path><path d="M8 12h8"></path><path d="M8 16h8"></path></svg>
                    Connect Serial
                </button>
                <button id="btnConnectBluetooth" class="btn primary">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5l11 11L12 23V1l5.5 5.5-11 11"></path></svg>
                    Connect Bluetooth
                </button>
                <button id="btnDisconnect" class="btn danger" disabled>Disconnect</button>
            </div>
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </section>

        <section class="content-section">
            <div class="tab-bar">
                <button class="tab-link active" data-tab="imageTab">Print Image</button>
                <button class="tab-link" data-tab="textTab">Print Text</button>
            </div>

            <div id="imageTab" class="tab-content active">
                <div class="controls-panel">
                    <div class="input-group">
                        <label for="fileInput" class="btn secondary">Choose Image</label>
                        <input type="file" id="fileInput" accept=".bmp,.png,.jpg,.jpeg,.gif" hidden disabled>
                        <span id="fileName" class="file-name">No file chosen</span>
                    </div>
                    
                    <div class="slider-group">
                        <label for="contrastSlider">Contrast Threshold:</label>
                        <input type="range" id="contrastSlider" min="0" max="255" value="128" disabled>
                        <span id="contrastValue" class="value-badge">128</span>
                    </div>

                    <button id="btnPrintImage" class="btn action" disabled>Print Image</button>
                </div>

                <div class="preview-container">
                    <h3>Preview (384px width)</h3>
                    <div class="canvas-wrapper">
                        <canvas id="previewCanvas"></canvas>
                        <div id="emptyPreview" class="empty-state">No Image Loaded</div>
                    </div>
                </div>
            </div>

            <div id="textTab" class="tab-content">
                <div class="controls-panel text-panel">
                    <p class="instruction">Enter text to render into a printable image format.</p>
                    <textarea id="textInputArea" placeholder="Hello world..." disabled></textarea>
                    
                    <div class="action-row">
                        <button id="btnGenerateText" class="btn action" disabled>Generate &amp; Preview</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="log-section">
            <div class="log-header">
                <h3>System Log</h3>
                <button id="btnClearLog" class="btn small">Clear</button>
            </div>
            <pre id="logTerminal">Awaiting connection...</pre>
        </section>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
