<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Serial Printer (Image & Text)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }

        h1 {
            color: #111;
        }

        button,
        input[type="file"],
        input[type="range"] {
            font-size: 16px;
            padding: 10px 15px;
            margin-right: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            vertical-align: middle;
            /* Align slider with buttons */
        }

        button {
            background-color: #007bff;
            color: white;
        }

        button:disabled {
            background-color: #ccc;
        }

        input[type="range"] {
            width: 200px;
            /* Make slider wider */
            background-color: transparent;
            /* Hide default track */
            -webkit-appearance: none;
            margin: 0;
            padding: 0;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            background: #ddd;
            border-radius: 4px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #007bff;
            margin-top: -6px;
            /* Center thumb on track */
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
        }

        #controls {
            margin-top: 20px;
            padding: 15px;
            background-color: #e9e9e9;
            border-radius: 5px;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            /* Allow wrapping on smaller screens */
            gap: 10px;
            /* Space between elements */
        }

        #controls label {
            font-weight: bold;
            margin-right: 5px;
        }

        #status {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }

        #previewContainer {
            margin-top: 20px;
            border: 1px dashed #ccc;
            padding: 10px;
            text-align: center;
            background-color: #fff;
        }

        #previewCanvas {
            border: 1px solid #333;
            background-color: #fff;
            /* Ensure white background for transparent images */
            max-width: 100%;
            /* Make sure it doesn't overflow */
            height: auto;
        }

        #log {
            margin-top: 20px;
            padding: 15px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            height: 200px;
            overflow-y: scroll;
            font-family: "Courier New", Courier, monospace;
            white-space: pre-wrap;
        }

        /* --- New Tab Styles --- */
        .tab-bar {
            border-bottom: 2px solid #ccc;
            margin-top: 20px;
        }

        .tab-link {
            font-size: 18px;
            padding: 10px 20px;
            border: none;
            background-color: transparent;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            /* Align with parent border */
            color: #555;
        }

        .tab-link.active {
            border-bottom-color: #007bff;
            font-weight: bold;
            color: #000;
        }

        .tab-content {
            display: none;
            /* Hide by default */
            padding-top: 20px;
        }

        .tab-content.active {
            display: block;
            /* Show active tab content */
        }

        #textInputArea {
            width: 100%;
            box-sizing: border-box;
            /* Include padding in width */
            height: 150px;
            font-size: 16px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        #textModeControls {
            text-align: right;
        }
    </style>
</head>

<body>
    <h1>"Raw" Browser Printer (Image & Text)</h1>
    <p>Connect, select a mode, and print.</p>

    <button id="connectButton">Connect to Printer</button>

    <div id="status">STATUS: DISCONNECTED</div>

    <!-- --- New Tab Navigation --- -->
    <div class="tab-bar">
        <button class="tab-link active" id="tabImage">Print Image</button>
        <button class="tab-link" id="tabText">Print Text</button>
    </div>

    <!-- --- Image Mode Content --- -->
    <div id="imageMode" class="tab-content active">
        <div id="controls">
            <input type="file" id="fileInput" accept=".bmp,.png,.jpg,.jpeg,.gif" disabled>
            <label for="contrastSlider">Contrast Threshold:</label>
            <input type="range" id="contrastSlider" min="0" max="255" value="128" disabled>
            <span id="contrastValue">128</span>
            <button id="printImageButton" disabled>Print Image</button>
        </div>

        <div id="previewContainer">
            <p>Image Preview (384px width)</p>
            <canvas id="previewCanvas"></canvas>
        </div>
    </div>

    <!-- --- Text Mode Content --- -->
    <div id="textMode" class="tab-content">
        <p>Enter text, then generate an image to print.</p>
        <textarea id="textInputArea" placeholder="Hello world..." disabled></textarea>
        <div id="textModeControls">
            <!-- This button now generates an image, it doesn't print directly -->
            <button id="generateTextButton" disabled>Generate Image from Text</button>
        </div>
    </div>

    <pre id="log">Awaiting connection...</pre>

    <script>
        // --- Get UI Elements ---
        const connectButton = document.getElementById('connectButton');
        const fileInput = document.getElementById('fileInput');
        const contrastSlider = document.getElementById('contrastSlider');
        const contrastValueSpan = document.getElementById('contrastValue');
        const printImageButton = document.getElementById('printImageButton'); // Renamed
        const statusDiv = document.getElementById('status');
        const logDiv = document.getElementById('log');
        const previewCanvas = document.getElementById('previewCanvas');
        const previewCtx = previewCanvas.getContext('2d');

        // --- New Tab Elements ---
        const tabImage = document.getElementById('tabImage');
        const tabText = document.getElementById('tabText');
        const imageModeDiv = document.getElementById('imageMode');
        const textModeDiv = document.getElementById('textMode');
        const textInputArea = document.getElementById('textInputArea');
        const generateTextButton = document.getElementById('generateTextButton'); // Changed from printTextButton

        // --- Printer Constants ---
        const PRINTER_WIDTH_PX = 384;
        const SLICE_HEIGHT_PX = 8;
        const BAUD_RATE = 9600;

        // --- ESC/POS Command Constants (as Uint8Arrays) ---
        const INIT = new Uint8Array([0x1B, 0x40]); // Initialize Printer
        const FEED_ONE_LINE = new Uint8Array([0x0A]); // Simple Line Feed (LF)

        // --- Global Port Variable ---
        let port;
        let writer;
        let currentImage = null; // Stores the loaded image object
        let currentImageData = null; // Stores the processed ImageData from canvas

        /**
         * Logs a message to the on-screen console.
         */
        function log(message) {
            console.log(message);
            logDiv.textContent += message + '\n';
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // --- Tab Switching Logic ---
        tabImage.addEventListener('click', () => {
            tabImage.classList.add('active');
            tabText.classList.remove('active');
            imageModeDiv.classList.add('active');
            textModeDiv.classList.remove('active');
        });

        tabText.addEventListener('click', () => {
            tabText.classList.add('active');
            tabImage.classList.remove('active');
            textModeDiv.classList.add('active');
            imageModeDiv.classList.remove('active');
        });

        /**
         * Handles the "Connect" button click.
         */
        connectButton.addEventListener('click', async () => {
            try {
                log('Requesting serial port...');
                port = await navigator.serial.requestPort();

                log(`Opening port at ${BAUD_RATE} baud...`);
                await port.open({ baudRate: BAUD_RATE });

                writer = port.writable.getWriter();

                log('--- PRINTER CONNECTED ---');
                statusDiv.textContent = 'STATUS: CONNECTED (Light should stop blinking)';
                statusDiv.style.color = 'green';
                connectButton.disabled = true;

                // Enable controls for both modes
                fileInput.disabled = false;
                textInputArea.disabled = false;
                generateTextButton.disabled = false; // Enable new button
                // Note: contrastSlider and printImageButton are enabled when an image is loaded

                port.addEventListener('close', () => {
                    log('--- PRINTER DISCONNECTED ---');
                    statusDiv.textContent = 'STATUS: DISCONNECTED';
                    statusDiv.style.color = 'red';
                    connectButton.disabled = false;

                    // Disable all controls
                    fileInput.disabled = true;
                    contrastSlider.disabled = true;
                    printImageButton.disabled = true;
                    textInputArea.disabled = true;
                    generateTextButton.disabled = true; // Disable new button

                    if (writer) {
                        writer.releaseLock();
                    }
                });

            } catch (err) {
                log(`--- CONNECTION ERROR ---`);
                log(err.message);
            }
        });

        /**
         * Handles the file input.
         * Loads the image and displays a preview.
         */
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            log(`File selected: ${file.name}`);
            try {
                const imageUrl = URL.createObjectURL(file);
                currentImage = new Image(); // Store the image globally

                currentImage.onload = async () => {
                    log('Image loaded. Displaying preview...');

                    // Display initial preview with current contrast setting
                    displayImageOnCanvas(currentImage, parseInt(contrastSlider.value));

                    URL.revokeObjectURL(imageUrl); // Revoke temporary URL

                    contrastSlider.disabled = false; // Enable contrast slider
                    printImageButton.disabled = false;     // Enable print button
                };

                currentImage.onerror = () => {
                    log('Error loading image.');
                    URL.revokeObjectURL(imageUrl);
                };

                currentImage.src = imageUrl;

            } catch (err) {
                log(`--- IMAGE PROCESSING ERROR ---`);
                log(err.message);
            }
        });

        /**
         * Updates the image preview on the canvas.
         * @param {Image} img The loaded HTML Image object.
         * @param {number} contrastThreshold The threshold for B&W conversion.
         */
        function displayImageOnCanvas(img, contrastThreshold) {
            // This function now *requires* an image object
            if (!img) {
                // Clear the preview canvas if no image
                previewCanvas.width = PRINTER_WIDTH_PX;
                previewCanvas.height = 50; // Set a default small height
                previewCtx.fillStyle = '#FFFFFF';
                previewCtx.fillRect(0, 0, previewCanvas.width, previewCanvas.height);
                previewCtx.fillStyle = '#AAAAAA';
                previewCtx.textAlign = 'center';
                previewCtx.fillText('No image loaded', PRINTER_WIDTH_PX / 2, 25);
                currentImageData = null; // Ensure no data is stored
                return;
            }

            const scaledHeight = Math.floor(img.height * (PRINTER_WIDTH_PX / img.width));

            previewCanvas.width = PRINTER_WIDTH_PX;
            previewCanvas.height = scaledHeight;

            // Draw original image to get pixel data
            previewCtx.drawImage(img, 0, 0, PRINTER_WIDTH_PX, scaledHeight);

            // Get the raw pixel data
            const imageData = previewCtx.getImageData(0, 0, PRINTER_WIDTH_PX, scaledHeight);
            const data = imageData.data; // This is a Uint8ClampedArray [R,G,B,A, R,G,B,A, ...]

            // Convert to Black & White for preview
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                // --- FIX: Use the same luminance calculation as the printer for an accurate preview ---
                const average = (0.2126 * r + 0.7152 * g + 0.0722 * b);
                const bw = average < contrastThreshold ? 0 : 255; // 0=black, 255=white
                data[i] = bw;      // Red
                data[i + 1] = bw;  // Green
                data[i + 2] = bw;  // Blue
                // data[i + 3] (Alpha) remains unchanged
            }

            // Put the B&W image data back on the canvas for preview
            previewCtx.putImageData(imageData, 0, 0);

            // Store the processed ImageData for printing later
            currentImageData = imageData;
        }

        /**
         * Event listener for the contrast slider. Updates the preview.
         */
        contrastSlider.addEventListener('input', () => {
            const threshold = parseInt(contrastSlider.value);
            contrastValueSpan.textContent = threshold;
            if (currentImage) {
                // Re-run the display logic with the new threshold
                displayImageOnCanvas(currentImage, threshold);
            }
        });

        /**
         * Event listener for the "Print Image" button.
         */
        printImageButton.addEventListener('click', async () => {
            if (!currentImageData) {
                log('No image loaded to print.');
                return;
            }
            if (!writer) {
                log('Printer not connected.');
                return;
            }

            log('--- Starting Image Print Job ---');
            printImageButton.disabled = true; // Disable during print
            fileInput.disabled = true;
            contrastSlider.disabled = true;
            generateTextButton.disabled = true;

            try {
                // ... (rest of the logic)

                // --- New Print Logic ---
                // 1. Get the original image
                if (!currentImage) throw new Error("No source image loaded.");

                // 2. Create a new off-screen canvas to draw the *original*
                const printCanvas = document.createElement('canvas');
                const printCtx = printCanvas.getContext('2d');
                const scaledHeight = Math.floor(currentImage.height * (PRINTER_WIDTH_PX / currentImage.width));
                printCanvas.width = PRINTER_WIDTH_PX;
                printCanvas.height = scaledHeight;
                printCtx.drawImage(currentImage, 0, 0, PRINTER_WIDTH_PX, scaledHeight);

                // 3. Get its *original* pixel data
                const originalImageData = printCtx.getImageData(0, 0, PRINTER_WIDTH_PX, scaledHeight);

                // 4. Get the *current* contrast
                // --- FIX: Renamed to avoid declaration conflict ---
                const printThreshold = parseInt(contrastSlider.value);

                // 5. Pass the *original* data and *current* threshold to the printer
                await printImageDataToPrinter(originalImageData, printThreshold);

                log('--- Print Job Finished ---');
            } catch (err) {
                log(`--- PRINT ERROR ---`);
                log(err.message);
            } finally {
                printImageButton.disabled = false; // Re-enable after print
                fileInput.disabled = false;
                contrastSlider.disabled = false;
                generateTextButton.disabled = false;
            }
        });

        /**
         * NEW: Event listener for the "Generate Image from Text" button.
         */
        generateTextButton.addEventListener('click', () => {
            const text = textInputArea.value;
            if (!text) {
                log('No text to generate.');
                return;
            }
            log('Generating image from text...');
            generateTextButton.disabled = true;

            try {
                // --- 1. Create off-screen canvas and context ---
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // --- 2. Set styles and dimensions ---
                const canvasWidth = 384;
                const fontSize = 20; // Font size for the text
                const lineHeight = 24; // Space between lines
                const padding = 5; // Small padding from the edge
                ctx.font = `${fontSize}px sans-serif`;

                // --- 3. Text Wrapping Logic ---
                // First, split by manual newlines
                const paragraphs = text.split('\n');
                const lines = [];

                for (const para of paragraphs) {
                    const words = para.split(' ');
                    let currentLine = '';
                    for (const word of words) {
                        const testLine = currentLine + word + ' ';
                        const metrics = ctx.measureText(testLine);
                        // Check if line exceeds width (minus padding on both sides)
                        if (metrics.width > (canvasWidth - padding * 2) && currentLine !== '') {
                            lines.push(currentLine.trim());
                            currentLine = word + ' ';
                        } else {
                            currentLine = testLine;
                        }
                    }
                    lines.push(currentLine.trim());
                }

                // --- 4. Set final canvas size based on text height ---
                const canvasHeight = (lines.length * lineHeight) + (padding * 2);
                canvas.width = canvasWidth;
                canvas.height = canvasHeight;

                // --- 5. Re-render text on correctly-sized canvas ---
                // (Context is reset on resize, so set styles again)
                ctx.fillStyle = '#FFFFFF'; // White background
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);
                ctx.fillStyle = '#000000'; // Black text
                ctx.font = `${fontSize}px sans-serif`;
                ctx.textBaseline = 'top'; // Align text to the top

                for (let i = 0; i < lines.length; i++) {
                    ctx.fillText(lines[i], padding, padding + (i * lineHeight));
                }

                // --- 6. Convert canvas to an Image object ---
                const dataUrl = canvas.toDataURL();
                const img = new Image();
                img.src = dataUrl;

                img.onload = () => {
                    // --- 7. Load this new image into the Image Mode tab ---
                    currentImage = img; // Set the global image

                    // Display it on the preview canvas with the current contrast
                    displayImageOnCanvas(currentImage, parseInt(contrastSlider.value));

                    // --- 8. Enable controls and switch tabs ---
                    contrastSlider.disabled = false;
                    printImageButton.disabled = false;
                    tabImage.click(); // Programmatically click the Image tab
                    log('Text rendered to image. Go to "Print Image" tab to preview and print.');
                };
                img.onerror = () => {
                    log('Error converting canvas to image.');
                }

            } catch (err) {
                log(`--- TEXT RENDER ERROR ---`);
                log(err.message);
            } finally {
                generateTextButton.disabled = false;
            }
        });


        /**
         * Creates the 'GS v 0' bitmap header as a Uint8Array.
         */
        function createBitmapHeader(sliceHeight) {
            const widthInBytes = PRINTER_WIDTH_PX / 8; // 384 / 8 = 48 bytes
            return new Uint8Array([
                0x1D, 0x76, 0x30, 0x00, // 'GS v 0' command, mode 0
                widthInBytes, 0,         // Width: 48 bytes
                sliceHeight, 0           // Height: 1-8 dots (variable!)
            ]);
        }

        /**
         * Main function to convert ImageData to raw printer buffers and send.
         * @param {ImageData} imageData The *original* (color/grayscale) pixel data
         * @param {number} contrastThreshold The threshold used for B&W conversion
         */
        async function printImageDataToPrinter(imageData, contrastThreshold) {
            if (!writer) {
                throw new Error("Printer is not connected.");
            }

            const width = imageData.width;
            const height = imageData.height;

            // Helper function to read a pixel from ImageData based on threshold
            // This function ensures we use the *latest* contrast threshold
            function isPixelBlackForPrinter(x, y) {
                const pixelIndex = (y * width + x) * 4;
                const r = imageData.data[pixelIndex];
                const g = imageData.data[pixelIndex + 1];
                const b = imageData.data[pixelIndex + 2];

                // Use a standard luminance calculation for better grayscale conversion
                const average = (0.2126 * r + 0.7152 * g + 0.0722 * b);
                return (average < contrastThreshold);
            }

            log('Sending INIT command...');
            await writer.write(INIT);

            log('Starting image data stream...');
            const sliceWidthInBytes = PRINTER_WIDTH_PX / 8;

            for (let y_slice = 0; y_slice < height; y_slice += SLICE_HEIGHT_PX) {
                const actualSliceHeight = Math.min(SLICE_HEIGHT_PX, height - y_slice);

                const header = createBitmapHeader(actualSliceHeight);
                await writer.write(header);

                const sliceData = new Uint8Array(sliceWidthInBytes * actualSliceHeight);
                let sliceBufferIndex = 0;

                for (let y = 0; y < actualSliceHeight; y++) {
                    const currentY = y_slice + y;
                    for (let x_byte = 0; x_byte < sliceWidthInBytes; x_byte++) {
                        let horizontalByte = 0;
                        for (let bit = 0; bit < 8; bit++) {
                            const currentX = (x_byte * 8) + bit;
                            if (isPixelBlackForPrinter(currentX, currentY)) {
                                horizontalByte |= (1 << (7 - bit));
                            }
                        }
                        sliceData[sliceBufferIndex] = horizontalByte;
                        sliceBufferIndex++;
                    }
                }
                await writer.write(sliceData);
            }
            log('Image data stream finished.');

            log('Sending feed commands...');
            await writer.write(FEED_ONE_LINE);
            await writer.write(FEED_ONE_LINE);
            await writer.write(FEED_ONE_LINE);
        }

    </script>
</body>

</html>
